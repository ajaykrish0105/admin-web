<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal</title>
</head>
<body>
  <p>Opening...</p>
  <script>
    const customerSite = 'https://ajaykrish0105.github.io/editing-webpage/#hero';
    const adminPage = 'admin.html';

    // The Admin page's "View Public Website" button points here.
    // Direct visits to /admin-web/ still open the admin login.
    if (document.referrer.includes('/admin-web/admin.html')) {
      window.location.replace(customerSite);
    } else {
      window.location.replace(adminPage);
    }
  </script>
</body>
</html>
